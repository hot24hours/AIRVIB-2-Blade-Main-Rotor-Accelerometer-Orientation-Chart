<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRVIB 2-Blade Main Rotor & Accelerometer Orientation Chart</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', system-ui, sans-serif; color: #0f172a; }
        canvas { touch-action: none; }
        select:focus { outline: none; border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-6 flex flex-col items-center justify-center">

    <div class="max-w-5xl w-full bg-white border border-slate-200 rounded-2xl p-5 sm:p-6 shadow-sm space-y-5">
        
        <!-- Header Bar -->
        <div class="flex flex-wrap items-center justify-between gap-4 pb-2 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="p-3 bg-slate-900 text-white rounded-xl shadow-md">
                    <i class="fa-solid fa-helicopter text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight">
                        AIRVIB 2-Blade Main Rotor & Accelerometer Orientation Chart
                    </h1>
                    <p class="text-xs text-slate-500 font-medium tracking-wide">
                        Interactive Azimuth & Phase Alignment Reference
                    </p>
                </div>
            </div>

            <!-- Interactive Control Dropdowns -->
            <div class="flex flex-wrap items-center gap-4 text-xs font-semibold">
                <!-- Rotor Direction Selection -->
                <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5">
                    <i class="fa-solid fa-arrows-spin text-sky-600"></i>
                    <label for="rotor_direction" class="text-slate-600">Rotor Direction:</label>
                    <select id="rotor_direction" onchange="drawOrientationChart()" class="border border-slate-300 rounded-lg px-2.5 py-1 bg-white font-bold text-slate-900 cursor-pointer shadow-sm">
                        <option value="CCW" selected>Counterclockwise (CCW)</option>
                        <option value="CW">Clockwise (CW)</option>
                    </select>
                </div>
                
                <!-- Accelerometer Alignment Selection -->
                <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5">
                    <i class="fa-solid fa-gauge-high text-red-500"></i>
                    <label for="acc_orientation" class="text-slate-600">Accelerometer Alignment:</label>
                    <select id="acc_orientation" onchange="drawOrientationChart()" class="border border-slate-300 rounded-lg px-2.5 py-1 bg-white font-bold text-slate-900 cursor-pointer shadow-sm">
                        <option value="0" selected>0° (12H)</option>
                        <option value="90">90° (3H)</option>
                        <option value="180">180° (6H)</option>
                        <option value="270">270° (9H)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Interactive Canvas Viewport -->
        <div class="w-full aspect-[16/10] max-h-[600px] flex items-center justify-center bg-slate-50/80 rounded-xl border border-slate-100 overflow-hidden shadow-inner p-2">
            <canvas id="chartCanvas" width="920" height="600" class="w-full h-full object-contain"></canvas>
        </div>

    </div>

    <!-- Application Script -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            drawOrientationChart();
            window.addEventListener('resize', drawOrientationChart);
        });

        function drawOrientationChart() {
            const canvas = document.getElementById('chartCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const cx = w / 2, cy = h / 2;
            const rDial = 200; // Outer Accelerometer Dial Radius

            // User Selection Inputs
            const direction = document.getElementById('rotor_direction').value; // 'CCW' or 'CW'
            const rotOffset = parseInt(document.getElementById('acc_orientation').value) || 0;

            ctx.clearRect(0, 0, w, h);

            // Calculate rotation angle for 12H (0°)
            let visualDegZero = (direction === 'CW') ? rotOffset : -rotOffset;
            let radZero = (visualDegZero - 90) * Math.PI / 180;

            // 1. Inner Rotor Disc Boundary
            const rDisc = 135;
            ctx.beginPath();
            ctx.arc(cx, cy, rDisc, 0, 2 * Math.PI);
            ctx.strokeStyle = '#e2e8f0';
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.setLineDash([]);

            // 2. Helicopter Silhouette Body
            // Landing Skids (Side rails & cross struts)
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(cx - 30, cy - 24); ctx.lineTo(cx - 30, cy + 32);
            ctx.moveTo(cx + 30, cy - 24); ctx.lineTo(cx + 30, cy + 32);
            ctx.stroke();

            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(cx - 30, cy - 10); ctx.lineTo(cx - 18, cy - 10);
            ctx.moveTo(cx - 30, cy + 18); ctx.lineTo(cx - 16, cy + 18);
            ctx.moveTo(cx + 30, cy - 10); ctx.lineTo(cx + 18, cy - 10);
            ctx.moveTo(cx + 30, cy + 18); ctx.lineTo(cx + 16, cy + 18);
            ctx.stroke();

            // Fuselage Main Body Silhouette
            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1.5;

            ctx.beginPath();
            ctx.moveTo(cx, cy - 58); // Smooth Rounded Nose
            ctx.bezierCurveTo(cx + 20, cy - 56, cx + 25, cy - 36, cx + 25, cy - 10);
            ctx.bezierCurveTo(cx + 25, cy + 15, cx + 18, cy + 38, cx + 5, cy + 62);
            ctx.lineTo(cx + 3.5, cy + 118); // Tail boom right
            ctx.lineTo(cx - 3.5, cy + 118); // Tail boom left
            ctx.lineTo(cx - 5, cy + 62);
            ctx.bezierCurveTo(cx - 18, cy + 38, cx - 25, cy + 15, cx - 25, cy - 10);
            ctx.bezierCurveTo(cx - 25, cy - 36, cx - 20, cy - 56, cx, cy - 58);
            ctx.closePath();
            ctx.fill();

            // Windshield & Windows Cutouts (Clean White Filling)
            ctx.fillStyle = '#ffffff';

            // Cockpit Front Windshield
            ctx.beginPath();
            ctx.moveTo(cx - 2, cy - 53);
            ctx.bezierCurveTo(cx - 12, cy - 51, cx - 17, cy - 40, cx - 15, cy - 31);
            ctx.lineTo(cx - 2, cy - 31);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(cx + 2, cy - 53);
            ctx.bezierCurveTo(cx + 12, cy - 51, cx + 17, cy - 40, cx + 15, cy - 31);
            ctx.lineTo(cx + 2, cy - 31);
            ctx.closePath();
            ctx.fill();

            // Side Cabin Windows
            ctx.beginPath();
            ctx.moveTo(cx - 17, cy - 29); ctx.lineTo(cx - 21, cy - 29);
            ctx.bezierCurveTo(cx - 22, cy - 18, cx - 21, cy - 10, cx - 18, cy - 4);
            ctx.lineTo(cx - 16, cy - 4);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(cx + 17, cy - 29); ctx.lineTo(cx + 21, cy - 29);
            ctx.bezierCurveTo(cx + 22, cy - 18, cx + 21, cy - 10, cx + 18, cy - 4);
            ctx.lineTo(cx + 16, cy - 4);
            ctx.closePath();
            ctx.fill();

            // Roof Skylight Windows
            ctx.beginPath();
            ctx.rect(cx - 12, cy - 27, 9, 20);
            ctx.rect(cx + 3, cy - 27, 9, 20);
            ctx.fill();

            // Deck Hatch & Seam Accent Lines
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.ellipse(cx, cy + 8, 7, 12, 0, 0, 2 * Math.PI);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cx, cy + 45); ctx.lineTo(cx, cy + 112);
            ctx.stroke();

            // Horizontal Stabilizer with Vertical End-Plates
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.rect(cx - 27, cy + 92, 54, 6);
            ctx.fill();
            ctx.beginPath();
            ctx.rect(cx - 29, cy + 85, 4, 20);
            ctx.rect(cx + 25, cy + 85, 4, 20);
            ctx.fill();

            // Tail Rotor
            ctx.beginPath();
            ctx.rect(cx - 11, cy + 116, 22, 3);
            ctx.rect(cx - 1.5, cy + 110, 3, 15);
            ctx.fill();

            // 3. Synchronized 2-Blade Main Rotor
            const rBladeA = 110;
            const rBladeB = 106;

            function drawRotorBlade(angleRad, length, mainColor) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angleRad);

                // Root Pitch Grip Sleeve
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(0, -3);
                ctx.lineTo(16, -4);
                ctx.lineTo(24, -6);
                ctx.lineTo(length, -5);
                ctx.lineTo(length, 5);
                ctx.lineTo(24, 6);
                ctx.lineTo(16, 4);
                ctx.lineTo(0, 3);
                ctx.closePath();
                ctx.fillStyle = mainColor;
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            }

            // Blade A (0°) - Pink Accent
            drawRotorBlade(radZero, rBladeA, '#ec4899');

            // Blade B (180°) - Blue Accent
            drawRotorBlade(radZero + Math.PI, rBladeB, '#0284c7');

            // Center Rotor Hub Cap (Double Circle)
            ctx.beginPath();
            ctx.arc(cx, cy, 8.5, 0, 2 * Math.PI);
            ctx.fillStyle = '#0f172a';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, 3.5, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // 4. Direction Arrow Arc with Solid Triangular Head
            ctx.strokeStyle = '#0284c7';
            ctx.lineWidth = 2.5;
            const rArrow = 82;

            let tipX, tipY, tangentAngle;

            if (direction === 'CCW') {
                const startAngle = radZero - 0.15;
                const endAngle = radZero - Math.PI / 2;
                ctx.beginPath();
                ctx.arc(cx, cy, rArrow, startAngle, endAngle, true);
                ctx.stroke();

                tipX = cx + rArrow * Math.cos(endAngle);
                tipY = cy + rArrow * Math.sin(endAngle);
                tangentAngle = endAngle - Math.PI / 2;
            } else {
                const startAngle = radZero + 0.15;
                const endAngle = radZero + Math.PI / 2;
                ctx.beginPath();
                ctx.arc(cx, cy, rArrow, startAngle, endAngle, false);
                ctx.stroke();

                tipX = cx + rArrow * Math.cos(endAngle);
                tipY = cy + rArrow * Math.sin(endAngle);
                tangentAngle = endAngle + Math.PI / 2;
            }

            // Arrowhead
            ctx.save();
            ctx.translate(tipX, tipY);
            ctx.rotate(tangentAngle);
            ctx.fillStyle = '#0284c7';
            ctx.beginPath();
            ctx.moveTo(8, 0);
            ctx.lineTo(-6, -5.5);
            ctx.lineTo(-3, 0);
            ctx.lineTo(-6, 5.5);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Text Badge Helper
            function drawTextBadge(text, x, y, textColor, bgColor, borderColor) {
                ctx.save();
                ctx.font = 'bold 12px sans-serif';
                const metrics = ctx.measureText(text);
                const paddingX = 8;
                const h = 22;
                const w = metrics.width + paddingX * 2;

                ctx.fillStyle = bgColor;
                ctx.strokeStyle = borderColor;
                ctx.lineWidth = 1;

                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(x - w / 2, y - h / 2, w, h, 5);
                } else {
                    ctx.rect(x - w / 2, y - h / 2, w, h);
                }
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = textColor;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, x, y);
                ctx.restore();
            }

            // Offset Badge Position to Side of Blade Vector
            const perpX = -Math.sin(radZero);
            const perpY = Math.cos(radZero);

            // Blade A Badge (Pink Theme)
            const distA = rBladeA * 0.62;
            const badgeAx = cx + Math.cos(radZero) * distA + perpX * 38;
            const badgeAy = cy + Math.sin(radZero) * distA + perpY * 38;
            drawTextBadge('Blade A (0°)', badgeAx, badgeAy, '#db2777', '#fdf2f8', '#fbcfe8');

            // Blade B Badge (Blue Theme)
            const distB = rBladeB * 0.62;
            const badgeBx = cx - Math.cos(radZero) * distB - perpX * 38;
            const badgeBy = cy - Math.sin(radZero) * distB - perpY * 38;
            drawTextBadge('Blade B (180°)', badgeBx, badgeBy, '#0284c7', '#f0f9ff', '#bae6fd');

            // 5. Accelerometer Mounted at 12H (0°)
            let sensorX = cx + rDial * Math.cos(radZero);
            let sensorY = cy + rDial * Math.sin(radZero);

            ctx.save();
            ctx.translate(sensorX, sensorY);
            ctx.rotate(radZero + Math.PI / 2);

            // Top BNC Connector
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.rect(-4, -26, 8, 6);
            ctx.fill(); ctx.stroke();

            // Main Body
            ctx.fillStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.rect(-13, -20, 26, 16);
            ctx.fill(); ctx.stroke();

            // Red Up Arrow (▲)
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(0, -17);
            ctx.lineTo(-3.5, -11);
            ctx.lineTo(-1.5, -11);
            ctx.lineTo(-1.5, -6);
            ctx.lineTo(1.5, -6);
            ctx.lineTo(1.5, -11);
            ctx.lineTo(3.5, -11);
            ctx.closePath();
            ctx.fill();

            // Hex Nut Base
            ctx.fillStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.rect(-10, -4, 20, 7);
            ctx.fill(); ctx.stroke();

            // Threaded Stud
            ctx.fillStyle = '#f1f5f9';
            ctx.beginPath();
            ctx.rect(-5, 3, 10, 9);
            ctx.fill(); ctx.stroke();

            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1;
            for (let ty = 5; ty <= 10; ty += 2) {
                ctx.beginPath();
                ctx.moveTo(-4.5, ty);
                ctx.lineTo(4.5, ty);
                ctx.stroke();
            }

            ctx.restore();

            // 6. Outer Dial Ticks & Hour/Degree Labels (360° / 12H)
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let i = 0; i < 12; i++) {
                let clock = (i === 0) ? 12 : i;
                let deg = i * 30;

                let visualDeg = (direction === 'CW') ? deg + rotOffset : -deg - rotOffset;
                let rad = (visualDeg - 90) * Math.PI / 180;

                let xOut = cx + rDial * Math.cos(rad);
                let yOut = cy + rDial * Math.sin(rad);
                let xIn = cx + (rDial - 10) * Math.cos(rad);
                let yIn = cy + (rDial - 10) * Math.sin(rad);

                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = (clock % 3 === 0) ? 2.5 : 1.5;
                ctx.beginPath();
                ctx.moveTo(xIn, yIn); ctx.lineTo(xOut, yOut);
                ctx.stroke();

                // Sub-ticks
                for (let m = 1; m <= 3; m++) {
                    let subDeg = deg + m * 7.5;
                    let subVisual = (direction === 'CW') ? subDeg + rotOffset : -subDeg - rotOffset;
                    let subRad = (subVisual - 90) * Math.PI / 180;
                    let sx1 = cx + rDial * Math.cos(subRad);
                    let sy1 = cy + rDial * Math.sin(subRad);
                    let sx2 = cx + (rDial - 5) * Math.cos(subRad);
                    let sy2 = cy + (rDial - 5) * Math.sin(subRad);

                    ctx.strokeStyle = '#94a3b8';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(sx1, sy1); ctx.lineTo(sx2, sy2);
                    ctx.stroke();
                }

                // Push text outwards at Accelerometer location to prevent overlap
                let isAccPos = (deg === 0);
                let textDist = isAccPos ? rDial + 52 : rDial + 26;
                let lx = cx + textDist * Math.cos(rad);
                let ly = cy + textDist * Math.sin(rad);

                ctx.fillStyle = '#0f172a';
                ctx.font = 'bold 13px sans-serif';
                ctx.fillText(`${clock}H`, lx, ly - 6);

                ctx.fillStyle = '#64748b';
                ctx.font = '11px sans-serif';
                ctx.fillText(`${deg}°`, lx, ly + 8);
            }
        }
    </script>
</body>
</html>
